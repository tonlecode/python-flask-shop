{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="auth-card">
                <div class="auth-header text-center mb-4">
                    <div class="auth-logo mb-3">
                        <i class="fas fa-store fa-3x text-primary"></i>
                    </div>
                    <h3 class="fw-bold">Welcome Back!</h3>
                    <p class="text-muted">Sign in to your ShopKH account</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control" name="email" placeholder="you@example.com" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" class="form-control" name="password" id="passwordInput" placeholder="••••••••" required>
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('passwordInput', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                </form>

                <hr class="my-4">
                <div class="text-center">
                    <p class="text-muted mb-0">Don't have an account?
                        <a href="{{ url_for('register') }}" class="text-primary fw-semibold">Create Account</a>
                    </p>
                </div>

                <!-- Demo credentials -->
                <div class="demo-credentials mt-4">
                    <small class="text-muted d-block text-center mb-2"><i class="fas fa-info-circle me-1"></i>Demo Credentials</small>
                    <div class="row g-2">
                        <div class="col-6">
                            <div class="demo-box" onclick="fillDemo('admin@shopkh.com','admin123')">
                                <i class="fas fa-user-shield text-warning me-1"></i>
                                <small><strong>Admin</strong><br>admin@shopkh.com</small>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="demo-box" onclick="fillDemo('user@shopkh.com','user123')">
                                <i class="fas fa-user text-primary me-1"></i>
                                <small><strong>User</strong><br>user@shopkh.com</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function fillDemo(email, pass) {
    document.querySelector('input[name="email"]').value = email;
    document.querySelector('input[name="password"]').value = pass;
}
</script>
{% endblock %}
